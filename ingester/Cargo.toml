[package]
name = "lifewatch-ingester"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false }
csv = "1.4.0"
dotenv = "0.15.0"
postgres = { version = "0.19.12", features = [
    "with-serde_json-1",
    "with-chrono-0_4",
] }
regex = "1.12.2"
serde_json = "1.0.145"
ssh2 = "0.9.5"
tqdm = "0.8.0"
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }
