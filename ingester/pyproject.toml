[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "lifewatch-ingester"
version = "0.1.0"
dependencies = [
    "SQLAlchemy>=2",
    "psycopg>=3.3",
    "typer>=0.20",
    "python-dotenv>=1.2",
    "paramiko>=4",
]
requires-python = ">= 3.13"

[project.scripts]
lifewatch-ingester = "lifewatch.ingester:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lifewatch"]
