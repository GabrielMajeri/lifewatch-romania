[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "lifewatch"
version = "0.1.0"
dependencies = [
    "SQLAlchemy>=2",
    "psycopg>=3.3",
    "alembic>=1",
    "typer>=0.20",
    "python-dotenv>=1.2",
    "paramiko>=4",
    "coloredlogs>=15.0.1",
    "fastapi[standard]>=0.135.3",
    "pydantic>=2.13.0",
]
requires-python = ">= 3.14"

[project.scripts]
lifewatch = "lifewatch.cli.main:app"

[tool.fastapi]
entrypoint = "lifewatch.api.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lifewatch"]
