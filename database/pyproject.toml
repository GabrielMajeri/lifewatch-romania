[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "lifewatch"
version = "0.1.0"
dependencies = [
    "SQLAlchemy>=2",
    "psycopg2>=2.9",
    "alembic>=1",
    "typer>=0.20",
    "python-dotenv>=1.2",
]
requires-python = ">= 3.13"

[project.scripts]
lifewatch-db = "lifewatch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lifewatch"]
